name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      # Submodules use git@github.com: URLs; the runner has no SSH key.
      - name: Fetch submodules over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # AppIcon.icon was re-saved for Xcode 27 (a470d6b3); runners top out at Xcode 26.6, whose actool can't open it.
      # Use the version from just before that commit. Only changes how the app icon looks.
      - name: Use Xcode 26 app icon
        run: |
          git fetch --depth 1 origin bc3d77b1d7d012a2670dca95a9a2b3c2dbf5677d
          rm -rf Resources/AppIcon.icon
          git checkout bc3d77b1d7d012a2670dca95a9a2b3c2dbf5677d -- Resources/AppIcon.icon

      - name: Apply DeltaCore audio fix
        run: git -C Cores/DeltaCore apply "$GITHUB_WORKSPACE/patches/deltacore-audio-fix.patch"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Delta.xcworkspace \
            -scheme Delta \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Delta.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E 'error:|warning: .*AudioManager|\*\* ARCHIVE' || true
          test -d build/Delta.xcarchive/Products/Applications/Delta.app

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Delta.xcarchive/Products/Applications/Delta.app Payload/
          zip -qry Delta-2.0-audiofix.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Delta-2.0-audiofix
          path: Delta-2.0-audiofix.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
