name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90

    # Delta 2.0 uses iOS 27 SDK APIs (UIHinge, AVAudioSession messages), so it needs Xcode 27.
    steps:
      # Submodules use git@github.com: URLs; the runner has no SSH key.
      - name: Fetch submodules over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      # Applied in order: the fix, then diagnostics logging (Settings → Advanced → Export Log).
      - name: Apply DeltaCore patches
        run: |
          git -C Cores/DeltaCore apply "$GITHUB_WORKSPACE/patches/deltacore-audio-fix.patch"
          git -C Cores/DeltaCore apply "$GITHUB_WORKSPACE/patches/deltacore-audio-diag.patch"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Delta.xcworkspace \
            -scheme Delta \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Delta.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E 'error:|warning: .*AudioManager|\*\* ARCHIVE' || true
          test -d build/Delta.xcarchive/Products/Applications/Delta.app

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Delta.xcarchive/Products/Applications/Delta.app Payload/
          zip -qry Delta-2.0-audiofix-diag.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Delta-2.0-audiofix-diag
          path: Delta-2.0-audiofix-diag.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
